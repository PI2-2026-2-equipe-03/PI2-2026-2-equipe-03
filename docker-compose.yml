# compose central — orquestra frontend + backend + db em conjunto
name: tagravado

services:
  db:
    image: postgres:16-alpine
    container_name: tagravado-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tagravado}
      POSTGRES_USER: ${POSTGRES_USER:-tagravado}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tagravado}
    ports:
      # se a 5432 já estiver ocupada no host (Postgres local), sobrescreva POSTGRES_PORT no .env.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tagravado_db_data:/var/lib/postgresql/data
      # schema + seed; só rodam na primeira criação do volume (`down -v` para reaplicar).
      - ../pi2-backend/src/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tagravado} -d ${POSTGRES_DB:-tagravado}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pi2-net

  backend:
    build:
      context: ../pi2-backend
    container_name: tagravado-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3000
      # backend conecta no db pelo nome do serviço na rede interna.
      # como o front usa o proxy do vite, não precisa de cors; se chamar :3000 direto do
      # browser, habilitar @fastify/cors.
      DATABASE_URL: postgresql://${POSTGRES_USER:-tagravado}:${POSTGRES_PASSWORD:-tagravado}@db:5432/${POSTGRES_DB:-tagravado}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
    volumes:
      # Bind mount + volume anônimo em node_modules: hot reload via `tsx watch` sem sobrescrever deps do container.
      - ../pi2-backend:/app
      - /app/node_modules
    networks:
      - pi2-net

  frontend:
    build:
      context: ../pi2-frontend
    container_name: tagravado-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      # alvo do proxy /api do vite (ver vite.config.ts do frontend).
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:3000}
    volumes:
      - ../pi2-frontend:/app
      - /app/node_modules
      # vite só lê VITE_* de arquivos .env*. montar o .env do pmo aqui garante
      # que VITE_USE_MOCKS e VITE_API_URL cheguem ao browser.
      - ./.env:/app/.env.local:ro
    networks:
      - pi2-net

# modo dev vs prod:
# compose sobe ambos os apps em modo desenvolvimento (Vite dev server + tsx watch)
# para produção considerar adicionar um perfil
# `profiles: [prod]` com build estático do frontend servido por nginx e backend compilado (npm run build/start).
# profiles:
#   prod:
#     services:
#       frontend:
#         build:
#           context: ../pi2-frontend
#           target: production
#         command: npm run build && npm run preview
#       backend:
#         build:
#           context: ../pi2-backend
#           target: production
#         command: npm run build && npm run start

networks:
  pi2-net:
    name: pi2-net
    driver: bridge

volumes:
  tagravado_db_data:

# 🖖
