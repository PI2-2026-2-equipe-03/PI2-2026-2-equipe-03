<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="studio.js"></script>
<script src="marca.js"></script>
<script src="teco.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:#103A9E; }
  #root { position:relative; width:1920px; height:1080px; overflow:hidden; background:#103A9E;
    font-family:'Bricolage Grotesque', sans-serif; color:#fff; font-optical-sizing:auto; }
  svg.full, svg.palco { position:absolute; overflow:visible; }
  .hl { position:absolute; font-weight:800; letter-spacing:-0.025em; line-height:1.02; }
  .hl .w { display:inline-block; overflow:hidden; vertical-align:top; padding-bottom:.16em; margin-bottom:-.16em; }
  .hl .wi { display:inline-block; }
  .tag { position:absolute; font-weight:800; letter-spacing:-0.02em; }
  .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-mode="apresenta" data-start="0" data-duration="15" data-width="1920" data-height="1080"></div>
<script src="cena-teco.js"></script>
</body>
</html>
